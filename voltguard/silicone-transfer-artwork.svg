<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" width="1800" height="600">
  <defs>
    <style>
      .eq { font-family: 'Times New Roman', serif; font-size: 18px; fill: #1a1a1a; }
      .eq-title { font-family: 'Times New Roman', serif; font-size: 22px; font-weight: bold; fill: #1a1a1a; }
      .eq-small { font-family: 'Times New Roman', serif; font-size: 14px; fill: #333; }
      .eq-bold { font-family: 'Times New Roman', serif; font-size: 18px; font-weight: bold; fill: #1a1a1a; }
      .line { stroke: #333; stroke-width: 1; }
      .line-bold { stroke: #333; stroke-width: 2; }
      .dashed { stroke: #666; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>
  </defs>

  <rect width="1800" height="600" fill="#f5f5f0"/>

  <!-- Title -->
  <text x="900" y="40" text-anchor="middle" class="eq-title">Electromagnetic Field Analysis Worksheet</text>
  <line x1="200" y1="50" x2="1600" y2="50" class="line"/>

  <!-- Column 1: Maxwell's Equations -->
  <text x="100" y="85" class="eq-bold">Maxwell's Equations (Integral Form)</text>

  <text x="100" y="115" class="eq">∮ E · dA = Q_enc / ε₀</text>
  <text x="100" y="135" class="eq">∮ B · dA = 0</text>
  <text x="100" y="155" class="eq">∮ E · dl = -d/dt ∫ B · dA</text>
  <text x="100" y="175" class="eq">∮ B · dl = μ₀I_enc + μ₀ε₀ d/dt ∫ E · dA</text>

  <text x="100" y="210" class="eq-bold">Wave Equation Derivation</text>
  <text x="100" y="240" class="eq">∇²E = μ₀ε₀ ∂²E/∂t²</text>
  <text x="100" y="260" class="eq">∇²B = μ₀ε₀ ∂²B/∂t²</text>
  <text x="100" y="280" class="eq">c = 1 / √(μ₀ε₀)</text>
  <text x="100" y="300" class="eq">c = 299,792,458 m/s</text>

  <text x="100" y="335" class="eq-bold">Plane Wave Solution</text>
  <text x="100" y="365" class="eq">E(r,t) = E₀ cos(k·r - ωt + φ)</text>
  <text x="100" y="385" class="eq">B(r,t) = B₀ cos(k·r - ωt + φ)</text>
  <text x="100" y="405" class="eq">k = 2π/λ</text>
  <text x="100" y="425" class="eq">ω = 2πf</text>

  <!-- Column 2: Shielding Calculations -->
  <text x="650" y="85" class="eq-bold">Skin Depth & Shielding</text>

  <text x="650" y="115" class="eq">δ = 1 / √(πfμσ)</text>
  <text x="650" y="135" class="eq">SE = 20 log₁₀(E_i / E_t)</text>
  <text x="650" y="155" class="eq">SE = R + A + M</text>

  <text x="650" y="190" class="eq-small">For Cu at 1 GHz:</text>
  <text x="650" y="210" class="eq">δ_Cu = 2.09 μm</text>
  <text x="650" y="230" class="eq">SE_1GHz ≈ 72 dB per 100 μm</text>

  <text x="650" y="265" class="eq-bold">Faraday Cage Attenuation</text>
  <text x="650" y="295" class="eq">f_c = c / 2a</text>
  <text x="650" y="315" class="eq">SE_dB = k · (t/δ) · log e</text>
  <text x="650" y="335" class="eq">η = √(μ/ε_r)</text>

  <text x="650" y="370" class="eq-bold">Conductive Fabric Parameters</text>
  <text x="650" y="400" class="eq">R_s = ρ / t</text>
  <text x="650" y="420" class="eq">σ = 1/ρ (conductivity)</text>
  <text x="650" y="440" class="eq">μ_r (relative permittivity)</text>

  <!-- Column 3: Field Mapping Diagram -->
  <text x="1200" y="85" class="eq-bold">Wave Propagation Diagram</text>

  <!-- Coordinate axes -->
  <line x1="1250" y1="130" x2="1250" y2="400" class="line"/>  <!-- y-axis -->
  <line x1="1200" y1="265" x2="1700" y2="265" class="line"/>  <!-- x-axis -->

  <!-- E field (sine wave) -->
  <path d="M1200,265 C1220,200 1240,200 1260,265 C1280,330 1300,330 1320,265 C1340,200 1360,200 1380,265 C1400,330 1420,330 1440,265 C1460,200 1480,200 1500,265 C1520,330 1540,330 1560,265 C1580,200 1600,200 1620,265 C1640,330 1660,330 1680,265" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- B field (out of phase) -->
  <path d="M1200,265 C1220,330 1240,330 1260,265 C1280,200 1300,200 1320,265 C1340,330 1360,330 1380,265 C1400,200 1420,200 1440,265 C1460,330 1480,330 1500,265 C1520,200 1540,200 1560,265 C1580,330 1600,330 1620,265 C1640,200 1660,200 1680,265" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Labels -->
  <text x="1240" y="125" class="eq-small">E (V/m)</text>
  <text x="1240" y="420" class="eq-small">B (T)</text>
  <text x="1705" y="270" class="eq-small">z (propagation)</text>

  <!-- Wavelength annotation -->
  <line x1="1260" y1="435" x2="1380" y2="435" class="dashed"/>
  <text x="1290" y="455" class="eq-small">λ</text>

  <!-- Polarization -->
  <line x1="1200" y1="100" x2="1200" y2="120" class="line"/>
  <text x="1140" y="115" class="eq-small">Polarization: E_z</text>

  <!-- Bottom formulas, full width -->
  <line x1="50" y1="480" x2="1750" y2="480" class="line"/>

  <text x="100" y="510" class="eq-bold">Faraday's Law of Induction</text>
  <text x="100" y="540" class="eq">ε = -N · dΦ_B/dt</text>
  <text x="500" y="540" class="eq">Φ_B = ∫ B · dA</text>

  <text x="1000" y="510" class="eq-bold">Lenz's Law</text>
  <text x="1000" y="540" class="eq">E_ind = -dΦ/dt</text>
  <text x="1400" y="540" class="eq">Direction opposes change</text>

  <!-- Footer -->
  <line x1="50" y1="565" x2="1750" y2="565" class="line"/>
  <text x="900" y="590" text-anchor="middle" class="eq-small" fill="#888">TerraShield Research Laboratory | Protocol TSL-EMF-101 | Confidential</text>
</svg>